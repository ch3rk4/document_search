[tool.poetry]
name = "document-search"
version = "1.0.0"
description = "Поисковик по текстам документов с использованием Django и алгоритмов поиска"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
Django = "4.2.7"
djangorestframework = "3.14.0"
psycopg2-binary = "2.9.9"
python-decouple = "3.8"
django-cors-headers = "4.3.1"
django-filter = "23.4"
pytest = "7.4.3"
pytest-django = "4.7.0"
mypy = "1.7.1"
django-stubs = "4.2.7"
types-requests = "2.31.0.10"
black = "23.10.1"
flake8 = "6.1.0"
coverage = "7.3.2"
factory-boy = "3.3.0"
Faker = "19.12.0"
celery = "5.3.4"
redis = "5.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-django = "^4.7.0"
mypy = "^1.7.1"
black = "^23.10.1"
flake8 = "^6.1.0"
coverage = "^7.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations
)/
'''

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "manage"
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.settings"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true