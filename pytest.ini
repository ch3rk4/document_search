[tool:pytest]
DJANGO_SETTINGS_MODULE = document_search.test_settings
python_paths = src
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --reuse-db
    --no-cov-on-fail
    --cov-branch
testpaths = tests
python_files = test_*.py
python_classes = Test* *Test *Tests
python_functions = test_*

# Метки для фильтрации тестов
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    models: marks tests as model tests
    algorithms: marks tests as algorithm tests

# Настройки фильтрации предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::django.utils.deprecation.RemovedInDjango50Warning
    ignore::pytest.PytestUnraisableExceptionWarning

# Минимальная версия pytest
minversion = 6.0