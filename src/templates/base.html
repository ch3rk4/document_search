<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Поисковик документов{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .search-highlight {
            background-color: yellow;
            font-weight: bold;
        }
        .document-preview {
            max-height: 200px;
            overflow: hidden;
        }
        .tag {
            font-size: 0.8em;
            margin: 2px;
        }
        .search-stats {
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'doc_storage:document_list' %}">
                <i class="fas fa-search"></i> Поисковик документов
            </a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'doc_storage:search_history' %}">
                        <i class="fas fa-history"></i> История поиска
                    </a>
                    <a class="nav-link" href="{% url 'admin:index' %}">
                        <i class="fas fa-cog"></i> Админ-панель
                    </a>
                    <span class="nav-link">Привет, {{ user.username }}!</span>
                {% else %}
                    <a class="nav-link" href="{% url 'admin:login' %}">
                        <i class="fas fa-sign-in-alt"></i> Войти
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light mt-5 py-3">
        <div class="container text-center">
            <small class="text-muted">
                © 2025 Поисковик документов. Разработано с использованием Django REST Framework.
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
